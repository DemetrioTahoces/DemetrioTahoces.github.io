[project]
name = "cv-chatbot"
version = "2.0.0"
description = "Asistente del CV y blog técnico de Demetrio Tahoces (FastAPI + LangChain en Vercel)."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1,<1",
    "langchain>=1.4.2,<2",
    "langchain-core>=1.6.4,<2",
    "langchain-openai>=1.6.6,<2",
    "langgraph>=1.2.12,<1.3",
    "mcp>=2.2.0,<3",
    "pydantic-settings>=2.15.0,<3",
    "python-dotenv>=1.2.3,<2",
    "slowapi>=0.1.10,<0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pyyaml>=6.0",
    "uvicorn>=0.53.0",
]

[tool.pytest.ini_options]
testpaths = ["test", "evals"]
addopts = "-m 'not evals'"
markers = [
    "evals: evaluaciones contra el modelo real (requieren API_KEY, consumen tokens; solo las ejecuta un humano a mano)",
]
