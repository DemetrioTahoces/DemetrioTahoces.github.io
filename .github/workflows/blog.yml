name: Blog

# Valida que cada post del blog está completo y sincronizado (HTML, tarjeta,
# ficha del chatbot, draft de LinkedIn, metadatos). Solo stdlib, sin dependencias.

on:
  pull_request:
    paths:
      - "blog/**"
      - "CV/Chatbot/docs/blog/**"
      - ".agents/skills/**"
      - "scripts/**"
      - ".claude/skills/**"
      - ".agents/agents/**"
      - ".claude/agents/**"
      - ".codex/agents/**"
      - ".githooks/**"
      - ".github/workflows/blog.yml"
  push:
    branches: [main]
    paths:
      - "blog/**"
      - "CV/Chatbot/docs/blog/**"
      - ".agents/skills/**"
      - "scripts/**"
      - ".claude/skills/**"
      - ".agents/agents/**"
      - ".claude/agents/**"
      - ".codex/agents/**"
      - ".githooks/**"

# Solo lectura: ningún job necesita escribir en el repo.
permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # pdftotext para comparar el texto de los CV en PDF con la web (scripts/check_cv_pdf.py).
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: python3 scripts/check_all.py
