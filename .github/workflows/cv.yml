name: CV

# Umbrales de tarjetas y sincronía de skills y agentes al tocar el CV estático o su
# documentación RAG. Solo stdlib, sin dependencias. Los tests del chatbot (anclas) van en chatbot.yml.

on:
  pull_request:
    paths:
      - "index.html"
      - "CV/*.html"
      - "CV/Chatbot/docs/**"
      - ".agents/skills/edit-cv/**"
      - "scripts/**"
      - ".github/workflows/cv.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "CV/*.html"
      - "CV/Chatbot/docs/**"
      - ".agents/skills/edit-cv/**"
      - "scripts/**"

# Solo lectura: ningún job necesita escribir en el repo.
permissions:
  contents: read

concurrency:
  group: cv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check CV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/check_all.py
