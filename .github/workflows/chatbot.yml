name: Chatbot

on:
  pull_request:
    paths:
      - "CV/Chatbot/**"
      - "CV/chatbot.html"
      - "llms.txt"
      - ".github/workflows/chatbot.yml"
  push:
    branches: [main]
    paths:
      - "CV/Chatbot/**"
      - "llms.txt"

concurrency:
  group: chatbot-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: CV/Chatbot

jobs:
  tests:
    name: Tests offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run pytest

  evals:
    name: Evals (modelo real)
    needs: tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.CHATBOT_API_KEY }}
      MODEL_NAME: gpt-6-luna
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - name: Evals contra el modelo
        if: env.API_KEY != ''
        run: uv run pytest -m evals -p no:logging --tb=short
      - name: Aviso sin API key
        if: env.API_KEY == ''
        run: echo "::warning::Evals omitidas, falta el secreto CHATBOT_API_KEY"
