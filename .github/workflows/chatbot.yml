name: Chatbot

# Solo tests offline. Las evals (gastan tokens) no se ejecutan aquí: las lanza
# un humano a mano, ver chatbot-evals.yml y AGENTS.md.

on:
  pull_request:
    paths:
      - "CV/Chatbot/**"
      - "CV/chatbot.html"
      - "llms.txt"
      - ".github/workflows/chatbot.yml"
  push:
    branches: [main]
    paths:
      - "CV/Chatbot/**"
      - "llms.txt"

concurrency:
  group: chatbot-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: CV/Chatbot

jobs:
  tests:
    name: Tests offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run pytest
