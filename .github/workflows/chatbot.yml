name: Chatbot

# Solo tests offline. Las evals (gastan tokens) no se ejecutan aquí: las lanza
# un humano a mano, ver chatbot-evals.yml y AGENTS.md.

on:
  pull_request:
    paths:
      - "CV/Chatbot/**"
      - "CV/chatbot.html"
      - "llms.txt"
      - "index.html"
      - "CV/*.html"
      - "blog/posts/**"
      - ".github/workflows/chatbot.yml"
  push:
    branches: [main]
    paths:
      - "CV/Chatbot/**"
      - "llms.txt"
      - "index.html"
      - "CV/*.html"
      - "blog/posts/**"

# Solo lectura: ningún job necesita escribir en el repo.
permissions:
  contents: read

concurrency:
  group: chatbot-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: CV/Chatbot

jobs:
  tests:
    name: Tests offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      - run: uv run pytest
