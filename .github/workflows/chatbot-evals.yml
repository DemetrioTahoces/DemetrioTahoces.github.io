name: Chatbot evals

# Evals contra el modelo real: gastan tokens. Solo las lanza un humano a mano
# (Actions → Chatbot evals → Run workflow). No añadas otros disparadores ni las
# lances desde agentes o automatizaciones.
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: CV/Chatbot

jobs:
  evals:
    name: Evals (modelo real)
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.CHATBOT_API_KEY }}
      MODEL_NAME: gpt-6-luna
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - name: Evals contra el modelo
        if: env.API_KEY != ''
        run: uv run pytest -m evals -p no:logging --tb=short
      - name: Aviso sin API key
        if: env.API_KEY == ''
        run: echo "::warning::Evals omitidas, falta el secreto CHATBOT_API_KEY"
