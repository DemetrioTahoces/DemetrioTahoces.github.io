<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Git workflow con ramas por entorno, PRs del agente, cascada determinista y puerta de promoción</title>
  <desc id="desc">Cinco carriles con el tiempo de izquierda a derecha: hotfix temporal, main en producción, release 2.5 en staging, develop en dev y features temporales. Dos features salen de develop y vuelven por PR del agente con squash. Se corta release 2.5 desde develop de forma determinista. Desde main, con el tag v2.4, sale un hotfix que implementa el agente y que un humano clasifica como hotfix; vuelve a main por PR con el tag v2.4.1. La cascada lleva main a release 2.5 con merge directo del bot porque es limpio y el CI sale verde, y release 2.5 a develop por PR porque hay conflicto: el agente resuelve y el humano aprueba. Antes de producción, una puerta comprueba que main está contenido en la release y main avanza por fast-forward a release 2.5 con el tag v2.5.0, la misma imagen sin recompilar.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#07111f"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="40" y="56" fill="#e5edf7" font-size="30" font-weight="700">Una PR, su destino real y una cascada</text>
    <text x="40" y="88" fill="#a7b4c8" font-size="17">Lo determinista mueve ramas, el agente escribe código, el humano asume el riesgo</text>

    <!-- Nombres de rama -->
    <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" font-weight="600" fill="#e5edf7">
      <text x="40" y="170">hotfix/*</text>
      <text x="40" y="256">main</text>
      <text x="40" y="336">release/2.5</text>
      <text x="40" y="416">develop</text>
      <text x="40" y="490">feature/*</text>
    </g>
    <g font-size="13" fill="#7f8ea3">
      <text x="40" y="190">temporal</text>
      <text x="40" y="510">temporal</text>
    </g>

    <!-- Carriles -->
    <g stroke="#94a3b8" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="190" y1="250" x2="1068" y2="250"/>
      <line x1="440" y1="330" x2="1068" y2="330"/>
      <line x1="190" y1="410" x2="1068" y2="410"/>
      <line x1="270" y1="490" x2="320" y2="490"/>
      <line x1="470" y1="490" x2="540" y2="490"/>
    </g>

    <!-- Bifurcaciones -->
    <g fill="none" stroke="#94a3b8" stroke-opacity="0.7" stroke-width="2.5">
      <path d="M210 410C240 410 240 490 270 490"/>
      <path d="M370 410C420 410 420 490 470 490"/>
      <path d="M440 250C480 250 480 170 520 170"/>
    </g>
    <!-- Corte de release: determinista -->
    <path d="M370 410C405 410 405 330 440 330" fill="none" stroke="#e5edf7" stroke-width="2.5"/>

    <!-- PRs (squash) -->
    <g fill="none" stroke="#60a5fa" stroke-width="3.5">
      <path d="M320 490C345 490 345 410 370 410"/>
      <path d="M540 490C580 490 580 410 620 410"/>
      <path d="M520 170C560 170 560 250 600 250"/>
    </g>

    <!-- Cascada (merge commit) -->
    <g fill="none" stroke="#e5edf7" stroke-width="3" stroke-dasharray="9 7">
      <path d="M600 250C630 250 630 330 660 330"/>
      <path d="M660 330C690 330 690 410 720 410"/>
    </g>

    <!-- Fast-forward -->
    <path d="M660 330C740 290 930 290 1000 250" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-dasharray="2 8" stroke-linecap="round"/>

    <!-- Commits -->
    <g stroke="#07111f" stroke-width="3">
      <g fill="#a7b4c8">
        <circle cx="210" cy="250" r="9"/>
        <circle cx="440" cy="250" r="9"/>
        <circle cx="210" cy="410" r="9"/>
      </g>
      <g fill="#60a5fa">
        <circle cx="270" cy="490" r="9"/>
        <circle cx="320" cy="490" r="9"/>
        <circle cx="470" cy="490" r="9"/>
        <circle cx="540" cy="490" r="9"/>
        <circle cx="520" cy="170" r="9"/>
        <circle cx="370" cy="410" r="9"/>
        <circle cx="620" cy="410" r="9"/>
        <circle cx="600" cy="250" r="9"/>
      </g>
      <g fill="#e5edf7">
        <circle cx="440" cy="330" r="9"/>
        <circle cx="660" cy="330" r="9"/>
        <circle cx="720" cy="410" r="9"/>
      </g>
      <circle cx="1000" cy="250" r="10" fill="#22c55e"/>
    </g>

    <!-- Tags -->
    <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">
      <rect x="366" y="212" width="62" height="24" rx="12" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-width="1.5"/>
      <text x="397" y="229" fill="#22c55e">v2.4</text>
      <rect x="612" y="212" width="78" height="24" rx="12" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-width="1.5"/>
      <text x="651" y="229" fill="#22c55e">v2.4.1</text>
      <rect x="1012" y="212" width="78" height="24" rx="12" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-width="1.5"/>
      <text x="1051" y="229" fill="#22c55e">v2.5.0</text>
    </g>

    <!-- Entornos -->
    <g font-size="15" font-weight="700" text-anchor="middle" fill="#e5edf7">
      <rect x="1082" y="236" width="84" height="28" rx="14" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="1.5"/>
      <text x="1124" y="255">prod</text>
      <rect x="1082" y="316" width="84" height="28" rx="14" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="1124" y="335">staging</text>
      <rect x="1082" y="396" width="84" height="28" rx="14" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="1124" y="415">dev</text>
    </g>
    <text x="1124" y="362" fill="#7f8ea3" font-size="13" text-anchor="middle">cluster inactivo</text>

    <!-- Etiquetas -->
    <text x="520" y="138" font-size="15" font-weight="600" text-anchor="middle"><tspan fill="#60a5fa">agente implementa</tspan><tspan fill="#7f8ea3"> · </tspan><tspan fill="#22c55e">humano: es hotfix</tspan></text>
    <text x="360" y="376" fill="#e5edf7" font-size="15" font-weight="600" text-anchor="end">corte determinista</text>
    <text x="445" y="533" fill="#60a5fa" font-size="15" font-weight="600" text-anchor="middle">PR del agente · squash</text>

    <g font-size="15" text-anchor="end">
      <text x="590" y="286" fill="#e5edf7" font-weight="700">limpio + CI verde</text>
      <text x="590" y="306" fill="#a7b4c8">merge directo del bot</text>
    </g>
    <g font-size="15">
      <text x="738" y="362" fill="#e5edf7" font-weight="700">conflicto → PR</text>
      <text x="738" y="384"><tspan fill="#60a5fa" font-weight="600">agente resuelve</tspan><tspan fill="#7f8ea3"> · </tspan><tspan fill="#22c55e" font-weight="600">humano aprueba</tspan></text>
    </g>

    <!-- Puerta de promoción -->
    <rect x="730" y="262" width="200" height="56" rx="10" fill="#0f172a" stroke="#e5edf7" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="830" y="285" fill="#e5edf7" font-size="16" font-weight="700" text-anchor="middle">¿main ⊂ release?</text>
    <text x="830" y="306" fill="#a7b4c8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" text-anchor="middle">merge-base --is-ancestor</text>
    <text x="1000" y="196" fill="#a7b4c8" font-size="14" text-anchor="middle">misma imagen, sin recompilar</text>

    <!-- Leyenda -->
    <line x1="40" y1="562" x2="1160" y2="562" stroke="#94a3b8" stroke-opacity="0.2"/>
    <g font-size="14" font-weight="600" fill="#a7b4c8">
      <circle cx="48" cy="595" r="8" fill="#e5edf7"/>
      <text x="64" y="600">Determinista</text>
      <circle cx="184" cy="595" r="8" fill="#60a5fa"/>
      <text x="200" y="600">Agente</text>
      <circle cx="282" cy="595" r="8" fill="#22c55e"/>
      <text x="298" y="600">Humano</text>

      <line x1="560" y1="595" x2="604" y2="595" stroke="#60a5fa" stroke-width="3.5"/>
      <text x="614" y="600">PR (squash)</text>
      <line x1="740" y1="595" x2="784" y2="595" stroke="#e5edf7" stroke-width="3" stroke-dasharray="9 7"/>
      <text x="794" y="600">cascada (merge commit)</text>
      <line x1="990" y1="595" x2="1034" y2="595" stroke="#22c55e" stroke-width="3.5" stroke-dasharray="2 8" stroke-linecap="round"/>
      <text x="1044" y="600">fast-forward</text>
    </g>
  </g>
</svg>
