<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Una PR de hotfix y una cascada determinista hacia las ramas más nuevas</title>
  <desc id="desc">Tres ramas con su entorno: main en producción, release 2.5 en staging y develop en dev. Un hotfix entra por una PR en main y una cascada lo lleva a la release y después a develop. En cada salto, si el merge es limpio y el CI sale verde, el bot mergea directo; si hay conflicto o CI rojo, se abre una PR, el agente resuelve y el humano aprueba. Antes de promocionar a producción, una puerta comprueba que main está dentro de la release, y la promoción la decide un humano.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#e5edf7"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#07111f"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="40" y="62" fill="#e5edf7" font-size="30" font-weight="700">Una PR, su destino real y una cascada</text>
    <text x="40" y="96" fill="#a7b4c8" font-size="17">Lo determinista mueve ramas, el agente escribe código, el humano asume el riesgo</text>

    <!-- Leyenda -->
    <g font-size="13" font-weight="600">
      <rect x="760" y="44" width="14" height="14" rx="3" fill="#e5edf7" fill-opacity="0.15" stroke="#e5edf7"/>
      <text x="782" y="56" fill="#a7b4c8">Determinista</text>
      <rect x="900" y="44" width="14" height="14" rx="3" fill="#60a5fa" fill-opacity="0.2" stroke="#60a5fa"/>
      <text x="922" y="56" fill="#a7b4c8">Agente</text>
      <rect x="1010" y="44" width="14" height="14" rx="3" fill="#22c55e" fill-opacity="0.25" stroke="#22c55e"/>
      <text x="1032" y="56" fill="#a7b4c8">Humano</text>
    </g>

    <!-- Ramas -->
    <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" font-weight="600" fill="#e5edf7">
      <text x="40" y="176">main</text>
      <text x="40" y="336">release/2.5</text>
      <text x="40" y="496">develop</text>
    </g>
    <g stroke="#94a3b8" stroke-opacity="0.55" stroke-width="3">
      <line x1="190" y1="170" x2="920" y2="170" marker-end="url(#arrow-muted)"/>
      <line x1="190" y1="330" x2="920" y2="330" marker-end="url(#arrow-muted)"/>
      <line x1="190" y1="490" x2="920" y2="490" marker-end="url(#arrow-muted)"/>
    </g>
    <g fill="#0f172a" stroke="#94a3b8" stroke-width="2">
      <circle cx="880" cy="170" r="6"/>
      <circle cx="880" cy="330" r="6"/>
      <circle cx="880" cy="490" r="6"/>
    </g>

    <!-- PR de hotfix en main -->
    <rect x="186" y="118" width="128" height="28" rx="14" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="250" y="137" fill="#60a5fa" font-size="14" font-weight="700" text-anchor="middle">PR de hotfix</text>
    <circle cx="250" cy="170" r="9" fill="#60a5fa" stroke="#07111f" stroke-width="3"/>

    <!-- Cascada -->
    <line x1="250" y1="182" x2="250" y2="316" stroke="#e5edf7" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="250" cy="330" r="8" fill="#e5edf7" stroke="#07111f" stroke-width="3"/>
    <line x1="250" y1="342" x2="250" y2="476" stroke="#e5edf7" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="250" cy="490" r="8" fill="#e5edf7" stroke="#07111f" stroke-width="3"/>

    <!-- Salto 1 -->
    <rect x="290" y="196" width="580" height="108" rx="14" fill="#0f172a" stroke="#e5edf7" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="312" y="224" fill="#e5edf7" font-size="15" font-weight="700">Salto main → release/2.5 · CI sobre el commit del merge</text>
    <circle cx="318" cy="250" r="5" fill="#e5edf7"/>
    <text x="332" y="255" fill="#a7b4c8" font-size="15">limpio y CI verde → <tspan fill="#e5edf7" font-weight="600">merge directo del bot</tspan></text>
    <circle cx="318" cy="280" r="5" fill="#60a5fa"/>
    <text x="332" y="285" fill="#a7b4c8" font-size="15">conflicto o CI rojo → PR: <tspan fill="#60a5fa" font-weight="600">agente resuelve</tspan>, <tspan fill="#22c55e" font-weight="600">humano aprueba</tspan></text>

    <!-- Salto 2 -->
    <rect x="290" y="356" width="580" height="108" rx="14" fill="#0f172a" stroke="#e5edf7" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="312" y="384" fill="#e5edf7" font-size="15" font-weight="700">Salto release/2.5 → develop · mismos commits, mismo criterio</text>
    <circle cx="318" cy="410" r="5" fill="#e5edf7"/>
    <text x="332" y="415" fill="#a7b4c8" font-size="15">limpio y CI verde → <tspan fill="#e5edf7" font-weight="600">merge directo del bot</tspan></text>
    <circle cx="318" cy="440" r="5" fill="#60a5fa"/>
    <text x="332" y="445" fill="#a7b4c8" font-size="15">conflicto o CI rojo → PR: <tspan fill="#60a5fa" font-weight="600">agente resuelve</tspan>, <tspan fill="#22c55e" font-weight="600">humano aprueba</tspan></text>

    <!-- Entornos -->
    <g text-anchor="middle">
      <rect x="940" y="138" width="220" height="64" rx="12" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-opacity="0.7" stroke-width="2"/>
      <text x="1050" y="166" fill="#e5edf7" font-size="20" font-weight="700">prod</text>
      <text x="1050" y="189" fill="#a7b4c8" font-size="13">main = lo desplegado</text>

      <rect x="940" y="298" width="220" height="64" rx="12" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="2"/>
      <text x="1050" y="326" fill="#e5edf7" font-size="20" font-weight="700">staging</text>
      <text x="1050" y="349" fill="#a7b4c8" font-size="13">cluster inactivo</text>

      <rect x="940" y="458" width="220" height="64" rx="12" fill="#60a5fa" fill-opacity="0.06" stroke="#60a5fa" stroke-opacity="0.6" stroke-width="2"/>
      <text x="1050" y="486" fill="#e5edf7" font-size="20" font-weight="700">dev</text>
      <text x="1050" y="509" fill="#a7b4c8" font-size="13">lo que será la 2.6</text>
    </g>

    <!-- Puerta de promoción -->
    <line x1="958" y1="296" x2="958" y2="206" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-ok)"/>
    <rect x="978" y="214" width="182" height="74" rx="10" fill="#0f172a" stroke="#e5edf7" stroke-opacity="0.6" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="1069" y="236" fill="#e5edf7" font-size="13" font-weight="700">¿main dentro de</text>
      <text x="1069" y="254" fill="#e5edf7" font-size="13" font-weight="700">la release?</text>
      <text x="1069" y="277" fill="#22c55e" font-size="12" font-weight="600">si sí, promueve el humano</text>
    </g>

    <text x="40" y="580" fill="#a7b4c8" font-size="15">Un cambio entra por una sola PR en la rama más antigua afectada; la cascada solo baja hacia las más nuevas.</text>
  </g>
</svg>
